<div class="ctf-menu-wrapper">
  <div class="ctf-menu-left flex items-center gap-4">
    <div class="ctf-logo font-bold" role="img" aria-label="Hot beverage">☕</div>
  </div>

  <div class="ctf-menu-center">
    <hlm-menu-bar class="w-fit">
      <button hlmMenuBarItem [brnMenuTriggerFor]="target">Target</button>
      <button hlmMenuBarItem [brnMenuTriggerFor]="scripts">Scripts</button>
      <button hlmMenuBarItem [brnMenuTriggerFor]="utils">Utils</button>
      <button hlmMenuBarItem [brnMenuTriggerFor]="documentation">Documentation</button>
    </hlm-menu-bar>
  </div>

  <div class="ctf-menu-right">
    <button themeToggle></button>
  </div>

  <ng-template #target>
    <hlm-menu variant="menubar" class="w-56">
      <hlm-menu-group>
        <button hlmMenuItem>Configuration</button>
        <button hlmMenuItem>Ajout d’une cible</button>
        <button hlmMenuItem>Retrait d’une cible</button>
        <button hlmMenuItem>Sauvegarde d’une cible</button>
      </hlm-menu-group>
    </hlm-menu>
  </ng-template>

  <ng-template #scripts>
    <hlm-menu variant="menubar" class="w-48">
      <hlm-menu-group>
        <button hlmMenuItem>Web</button>
        <button hlmMenuItem>Reverse shell</button>
        <button hlmMenuItem>Reverse engineering</button>
      </hlm-menu-group>
    </hlm-menu>
  </ng-template>

  <ng-template #utils>
    <hlm-menu variant="menubar" class="w-64">
      <hlm-menu-group>
        <button hlmMenuItem>Tools: NMAP</button>
        <button hlmMenuItem>Tools: Gobuster</button>
        <button hlmMenuItem>Tools: Nikto</button>
        <button hlmMenuItem>Tools: Burp</button>
      </hlm-menu-group>

      <hlm-menu-separator />

      <hlm-menu-group>
        <button hlmMenuItem>CVE.org</button>
        <button hlmMenuItem>ExploitDB</button>
        <button hlmMenuItem>Notre documentation</button>
      </hlm-menu-group>
    </hlm-menu>
  </ng-template>

  <ng-template #documentation>
    <hlm-menu variant="menubar" class="w-56">
      <hlm-menu-group>
        <button hlmMenuItem>Documentation développeur</button>
        <button hlmMenuItem>Documentation utilisateur</button>
      </hlm-menu-group>
    </hlm-menu>
  </ng-template>
</div>
