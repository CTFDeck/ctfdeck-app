<hlm-sidebar class="ctf-chat-sidebar">
  <hlm-sidebar-header>
    <div class="px-4 py-3">
      <div class="font-semibold text-sm">Chat History</div>
      <div class="text-xs text-muted-foreground">Your recent conversations</div>
    </div>
  </hlm-sidebar-header>

  <hlm-sidebar-content>
    <ng-scrollbar hlm class="h-full ">
      <hlm-sidebar-group>
      <div class="px-3 py-2 flex gap-2 items-center">
        <button hlmButton (click)="newChat()" class="w-full">New chat</button>
      </div>

      <div class="px-2 py-2">
        <div hlmInputGroup class="w-full">
          <div hlmInputGroupAddon>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>

          <input
            hlmInputGroupInput
            class="w-full"
            placeholder="Search chats..."
            aria-label="Search chats"
            [(ngModel)]="search"
          />
        </div>
      </div>

      <hlm-sidebar-separator />

      <div class="px-3 py-2">
        <div class="text-xs font-medium mb-2">Projects</div>
        <div class="flex flex-col gap-1">
          <button hlmSidebarMenuButton *ngFor="let p of projects" class="text-sm text-left">{{ p.name }}</button>
        </div>
      </div>

      <hlm-sidebar-separator />

      <div class="px-3 py-2">
        <div class="text-xs font-medium mb-2">Chats</div>
        <div class="flex flex-col gap-1">
          <button
            hlmSidebarMenuButton
            *ngFor="let c of filteredChats"
            (click)="openChat(c)"
            class="text-sm text-left truncate"
            title="{{ c.title }}"
          >
            {{ c.title }}
          </button>
        </div>
      </div>
      </hlm-sidebar-group>
    </ng-scrollbar>
  </hlm-sidebar-content>

  <hlm-sidebar-footer>
    <div class="px-3 py-3 text-xs text-muted-foreground">Tip: Create projects to organize chats.</div>
  </hlm-sidebar-footer>
</hlm-sidebar>
