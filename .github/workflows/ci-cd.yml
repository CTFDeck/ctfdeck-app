name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['stage']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Angular App
        run: npm run build

      - name: Build Electron Main
        run: npm run electron:build

      - name: Package Electron App
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: npm run package -- --publish never

      # Clean up artifacts before upload to save space and avoid confusion
      - name: Cleanup Artifacts (Unix)
        working-directory: ./release
        if: runner.os != 'Windows' && github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          rm -rf win-unpacked linux-unpacked mac mac-arm64 builder-debug.yml .icon-icns || true

      - name: Cleanup Artifacts (Windows)
        working-directory: ./release
        if: runner.os == 'Windows' && github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue win-unpacked, linux-unpacked, mac, mac-arm64, builder-debug.yml, .icon-icns

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            ./release/*.exe
            ./release/*.dmg
            ./release/*.AppImage
            ./release/*.blockmap
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success' && github.event_name == 'pull_request' && github.base_ref == 'stage'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Get Version/Tag Info
        id: version
        shell: bash
        run: |
          echo "tag=pr-${{ github.event.pull_request.number }}-stage" >> $GITHUB_OUTPUT
          echo "title=CTFDeck Release #${{ github.event.pull_request.number }} to stage" >> $GITHUB_OUTPUT
          echo "notes=Automated release build for PR #${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "target_commitish=${{ github.head_ref }}" >> $GITHUB_OUTPUT

      - name: Delete Existing Release/Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          echo "Checking for existing release: $TAG_NAME"

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Deleting existing release: $TAG_NAME"
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          elif git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Deleting existing tag: $TAG_NAME"
            git push --delete origin "$TAG_NAME" || true
          fi

      # Small delay to ensure GitHub consistency after deletion
      - name: Wait for deletion propagation
        run: sleep 5

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.title }}"
          NOTES="${{ steps.version.outputs.notes }}"
          TARGET="${{ steps.version.outputs.target_commitish }}"

          echo "Creating release $TAG_NAME targeting $TARGET"
          echo "Files to upload:"
          find ./artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" \) -print

          # Create release (using --prerelease since these are dev/stage builds)
          # Use process substitution to properly handle filenames with spaces
          while IFS= read -r -d '' file; do
            FILES_ARRAY+=("$file")
          done < <(find ./artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.blockmap" \) -print0)

          gh release create "$TAG_NAME" \
            "${FILES_ARRAY[@]}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$TARGET" \
            --prerelease

  deploy-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure Wiki access
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/CTFDeck/ctfdeck-app.wiki.git wiki


      - name: Deploy documentation to Wiki
        run: |
          rm -rf wiki/*
          cp -r docs/* wiki/
          cp README.md wiki/Home.md

      - name: Check for changes
        id: changes
        run: |
          cd wiki
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "Changes detected"
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Push changes to Wiki
        if: env.skip == 'false'
        run: |
          cd wiki
          git commit -m "Update Wiki documentation"
          git push