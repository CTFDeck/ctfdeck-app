name: Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Angular App
        run: npm run build

      - name: Build Electron Main
        run: npm run electron:build

      - name: Package Electron App
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: npm run package -- --publish never

      - name: Cleanup Artifacts (Unix)
        working-directory: ./release
        if: runner.os != 'Windows' && github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          rm -rf win-unpacked linux-unpacked mac mac-arm64 builder-debug.yml .icon-icns || true

      - name: Cleanup Artifacts (Windows)
        working-directory: ./release
        if: runner.os == 'Windows' && github.event_name == 'pull_request' && github.base_ref == 'stage'
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue win-unpacked, linux-unpacked, mac, mac-arm64, builder-debug.yml, .icon-icns

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.base_ref == 'stage'
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            ./release/*.exe
            ./release/*.dmg
            ./release/*.AppImage
            ./release/*.blockmap
          retention-days: 1

  release:
    needs: build
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'stage') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/stage')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "Artifacts structure:"
          ls -R ./artifacts

      - name: Create ZIP archives
        run: |
          # ZIP pour Ubuntu
          if [ -d "./artifacts/artifacts-ubuntu-latest" ]; then
            cd ./artifacts/artifacts-ubuntu-latest && zip -r ../../release-linux-x64.zip . && cd ../..
          fi
          
          # ZIP pour Windows
          if [ -d "./artifacts/artifacts-windows-latest" ]; then
            cd ./artifacts/artifacts-windows-latest && zip -r ../../release-win-x64.zip . && cd ../..
          fi
          
          # ZIP pour macOS
          if [ -d "./artifacts/artifacts-macos-latest" ]; then
            cd ./artifacts/artifacts-macos-latest && zip -r ../../release-osx-x64.zip . && cd ../..
          fi

      - name: Verify ZIP files
        run: |
          echo "Created release archives:"
          ls -lh release-*.zip

      - name: Get PR number or use commit SHA
        id: version
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "tag=pr-${{ github.event.pull_request.number }}-stage" >> $GITHUB_OUTPUT
            echo "title=CTFDeck Release #${{ github.event.pull_request.number }} to stage" >> $GITHUB_OUTPUT
            echo "notes=Automated release build for PR #${{ github.event.pull_request.number }} targeting stage branch" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "tag=stage-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "title=CTFDeck Stage Release ${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "notes=Automated release build for commit ${SHORT_SHA} on stage branch" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release if exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Deleting existing release $TAG_NAME"
            gh release delete "$TAG_NAME" --yes
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Deleting existing tag $TAG_NAME"
            git push --delete origin "$TAG_NAME" || true
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          gh release create "$TAG_NAME" \
            release-linux-x64.zip \
            release-win-x64.zip \
            release-osx-x64.zip \
            --title "${{ steps.version.outputs.title }}" \
            --notes "${{ steps.version.outputs.notes }}" \
            --target ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

  deploy-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
    steps:
      - uses: actions/checkout@v4

      - name: Configure Wiki access
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/CTFDeck/ctfdeck-app.wiki.git wiki


      - name: Deploy documentation to Wiki
        run: |
          rm -rf wiki/*
          cp -r docs/* wiki/
          cp README.md wiki/Home.md

      - name: Check for changes
        id: changes
        run: |
          cd wiki
          git add .
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "Changes detected"
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Push changes to Wiki
        if: env.skip == 'false'
        run: |
          cd wiki
          git commit -m "Update Wiki documentation"
          git push