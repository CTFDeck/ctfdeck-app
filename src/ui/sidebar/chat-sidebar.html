<hlm-sidebar class="ctf-chat-sidebar" collapsible="none">
  <hlm-sidebar-header>
    <div class="flex w-full items-center justify-between px-4 py-3">
      <div *ngIf="!isCollapsed()" class="overflow-hidden whitespace-nowrap">
        <div class="font-semibold text-sm">Workspace</div>
        <div class="text-xs text-muted-foreground">Manage your lab</div>
      </div>
      <button
        hlmSidebarMenuButton
        (click)="toggleSidebar()"
        class="ml-auto p-1 h-8 w-8 flex items-center justify-center shrink-0"
      >
        <ng-icon name="lucidePanelLeft" />
      </button>
    </div>
  </hlm-sidebar-header>

  <hlm-sidebar-content>
    <ng-scrollbar hlm class="h-full">
      <hlm-sidebar-group>
        <!-- Top Actions -->
        <div class="px-3 py-2 flex flex-col gap-2">
          <button
            hlmSidebarMenuButton
            (click)="newProject()"
            class="text-xs flex items-center gap-2 h-9 px-3 bg-primary/10 hover:bg-primary/20 transition-colors border border-primary/20 rounded-md"
            title="New Project"
          >
            <ng-icon name="lucideLayoutGrid" />
            <span *ngIf="!isCollapsed()" class="truncate font-medium">New Project</span>
          </button>
          
          <div class="flex gap-2">
            <button
              hlmSidebarMenuButton
              (click)="newChat()"
              class="text-[11px] flex-1 flex items-center justify-center gap-1.5 h-8 bg-accent hover:bg-accent/80 transition-colors border border-border rounded-md"
              title="New Chat"
            >
              <ng-icon name="lucidePlus" />
              <span *ngIf="!isCollapsed()" class="truncate font-medium">Chat</span>
            </button>

            <button
              hlmSidebarMenuButton
              (click)="newWriteUp()"
              class="text-[11px] flex-1 flex items-center justify-center gap-1.5 h-8 bg-accent hover:bg-accent/80 transition-colors border border-border rounded-md"
              title="New Writeup"
            >
              <ng-icon name="lucidePlus" />
              <span *ngIf="!isCollapsed()" class="truncate font-medium">WriteUp</span>
            </button>
          </div>
        </div>

        <!-- Search -->
        <div class="px-3 py-2 mb-2" *ngIf="!isCollapsed()">
          <div hlmInputGroup class="w-full">
            <div hlmInputGroupAddon>
              <ng-icon name="lucideSearch" />
            </div>
            <input
              hlmInputGroupInput
              class="w-full text-xs h-8"
              placeholder="Search everything..."
              [(ngModel)]="search"
            />
          </div>
        </div>

        <hlm-sidebar-separator />

        <!-- 1. PROJECTS SECTION -->
        <div class="mt-4 px-2">
           <div class="flex items-center gap-2 px-2 py-1 mb-1" *ngIf="!isCollapsed()">
              <span class="text-[10px] font-bold text-muted-foreground tracking-widest uppercase">Projects</span>
           </div>
           
           <div *ngIf="hierarchy$ | async as projects" class="flex flex-col gap-0.5">
             <div *ngFor="let p of projects" class="flex flex-col">
                <!-- Project Node -->
                <div class="group flex items-center gap-2 px-3 py-1.5 rounded-md hover:bg-accent cursor-pointer transition-colors"
                     (click)="toggleProject(p.id)">
                    <ng-icon [name]="isProjectExpanded(p.id) ? 'lucideChevronDown' : 'lucideChevronRight'" 
                             class="text-muted-foreground w-3.5 h-3.5" />
                    <ng-icon name="lucideLayoutGrid" class="text-primary w-4 h-4" />
                    <span class="text-sm font-medium truncate flex-1">{{ p.name }}</span>
                    
                    <button class="opacity-0 group-hover:opacity-100 p-1 hover:bg-background/50 rounded"
                            (click)="$event.stopPropagation(); addFolder(p.id)">
                        <ng-icon name="lucideFolderPlus" class="w-3.5 h-3.5" />
                    </button>
                </div>

                <!-- Folders Tree -->
                <div *ngIf="isProjectExpanded(p.id)" class="ml-4 pl-2 border-l border-border flex flex-col gap-1 mt-1">
                    <ng-container *ngTemplateOutlet="folderTree; context: { $implicit: p.folders, projectId: p.id }">
                    </ng-container>
                </div>
             </div>
           </div>
        </div>

        <!-- 2. GLOBAL CHATS SECTION -->
        <div class="mt-6 px-2">
           <div class="flex items-center gap-2 px-2 py-1 mb-1" *ngIf="!isCollapsed()">
              <span class="text-[10px] font-bold text-muted-foreground tracking-widest uppercase">Recent Chats</span>
           </div>
           
           <div class="flex flex-col gap-0.5 px-1">
              <div *ngFor="let s of filteredChats((sessions$ | async) || [])"
                   class="ctf-item-group relative group/item"
                   [class.bg-accent]="s.id === (activeSessionId$ | async)"
                   draggable="true"
                   (dragstart)="onDragStart($event, 'session', s.id)">
                <button (click)="openChat(s)" 
                        class="text-xs text-left flex items-center gap-2 h-8 px-2 w-full rounded hover:bg-accent pr-14">
                  <ng-icon name="lucideMessageCircleDashed" class="w-3.5 h-3.5 text-muted-foreground" />
                  <span class="truncate">{{ s.name }}</span>
                </button>
                <div class="ctf-item-actions group-hover/item:opacity-100">
                    <button class="ctf-action-btn" (click)="$event.stopPropagation(); openRenameDialog(s)"><ng-icon name="lucidePencil"/></button>
                    <button class="ctf-action-btn ctf-action-destroy" (click)="$event.stopPropagation(); openDeleteDialog(s)"><ng-icon name="lucideTrash2"/></button>
                </div>
              </div>
           </div>
        </div>

        <!-- 3. GLOBAL WRITEUPS SECTION -->
        <div class="mt-6 px-2 pb-10">
           <div class="flex items-center gap-2 px-2 py-1 mb-1" *ngIf="!isCollapsed()">
              <span class="text-[10px] font-bold text-muted-foreground tracking-widest uppercase">Recent WriteUps</span>
           </div>
           
           <div class="flex flex-col gap-0.5 px-1">
              <div *ngFor="let w of filteredWriteUps((writeUps$ | async) || [])"
                   class="ctf-item-group relative group/item"
                   [class.bg-accent]="w.id === (activeWriteUpId$ | async)"
                   draggable="true"
                   (dragstart)="onDragStart($event, 'writeup', w.id)">
                <button (click)="openWriteUp(w)" 
                        class="text-xs text-left flex items-center gap-2 h-8 px-2 w-full rounded hover:bg-accent pr-14">
                  <ng-icon name="lucideFileText" class="w-3.5 h-3.5 text-muted-foreground" />
                  <span class="truncate">{{ w.name }}</span>
                </button>
                <div class="ctf-item-actions group-hover/item:opacity-100">
                    <button class="ctf-action-btn" (click)="$event.stopPropagation(); openRenameWriteUpDialog(w)"><ng-icon name="lucidePencil"/></button>
                    <button class="ctf-action-btn ctf-action-destroy" (click)="$event.stopPropagation(); openDeleteWriteUpDialog(w)"><ng-icon name="lucideTrash2"/></button>
                </div>
              </div>
           </div>
        </div>

      </hlm-sidebar-group>
    </ng-scrollbar>
  </hlm-sidebar-content>

  <!-- Recursive Folder Template -->
  <ng-template #folderTree let-folders let-projectId="projectId">
    <div *ngFor="let f of folders" class="flex flex-col">
        <!-- Folder Node -->
        <div class="group flex items-center gap-1.5 px-2 py-1 rounded-md hover:bg-accent cursor-pointer transition-colors relative"
             (click)="toggleFolder(f.id)"
             (dragover)="onDragOver($event)"
             (drop)="onDrop($event, projectId, f.id)">
             <ng-icon [name]="isFolderExpanded(f.id) ? 'lucideChevronDown' : 'lucideChevronRight'" 
                      class="text-muted-foreground w-3 h-3" />
             <ng-icon name="lucideFolderOpen" class="text-amber-500/80 w-3.5 h-3.5" />
             <span class="text-xs truncate flex-1 font-medium">{{ f.name }}</span>

             <div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100">
                <button class="p-0.5 hover:bg-background/50 rounded" (click)="$event.stopPropagation(); addFolder(projectId, f.id)"><ng-icon name="lucidePlus" class="w-3 h-3"/></button>
                <button *ngIf="!f.isSystem" class="p-0.5 hover:bg-background/50 rounded" (click)="$event.stopPropagation(); renameFolder(projectId, f.id, f.name)"><ng-icon name="lucidePencil" class="w-3 h-3"/></button>
                <button *ngIf="!f.isSystem" class="p-0.5 text-destructive rounded" (click)="$event.stopPropagation(); deleteFolder(projectId, f.id, f.name)"><ng-icon name="lucideTrash2" class="w-3 h-3"/></button>
             </div>
        </div>

        <!-- Folder Expanded Content -->
        <div *ngIf="isFolderExpanded(f.id)" class="ml-4 pl-2 border-l border-border flex flex-col gap-0.5 mt-0.5">
            <!-- Subfolders -->
            <ng-container *ngTemplateOutlet="folderTree; context: { $implicit: f.folders, projectId: projectId }"></ng-container>
            
            <!-- Items in Folder -->
            <div *ngFor="let s of f.sessions" class="ctf-item-group relative group/item"
                 [class.bg-accent]="s.id === (activeSessionId$ | async)"
                 draggable="true" (dragstart)="onDragStart($event, 'session', s.id)">
                <button (click)="openChat(s)" class="text-[11px] text-left flex items-center gap-2 h-7 px-2 w-full rounded hover:bg-accent pr-10">
                    <ng-icon name="lucideMessageCircleDashed" class="w-3 h-3" />
                    <span class="truncate">{{ s.name }}</span>
                </button>
            </div>
            <div *ngFor="let w of f.writeups" class="ctf-item-group relative group/item"
                 [class.bg-accent]="w.id === (activeWriteUpId$ | async)"
                 draggable="true" (dragstart)="onDragStart($event, 'writeup', w.id)">
                <button (click)="openWriteUp(w)" class="text-[11px] text-left flex items-center gap-2 h-7 px-2 w-full rounded hover:bg-accent pr-10">
                    <ng-icon name="lucideFileText" class="w-3 h-3" />
                    <span class="truncate">{{ w.name }}</span>
                </button>
            </div>
        </div>
    </div>
  </ng-template>

</hlm-sidebar>
