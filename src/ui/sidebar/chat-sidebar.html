<hlm-sidebar class="ctf-chat-sidebar">
  <hlm-sidebar-header>
    <div class="flex w-full items-center justify-between px-4 py-3">
      <div *ngIf="!isCollapsed()" class="overflow-hidden whitespace-nowrap">
        <div class="font-semibold text-sm">Chat History</div>
        <div class="text-xs text-muted-foreground">Your recent conversations</div>
      </div>
      <button
        hlmSidebarMenuButton
        (click)="toggleSidebar()"
        class="ml-auto p-1 h-8 w-8 flex items-center justify-center shrink-0"
      >
        <ng-icon name="lucidePanelLeft" />
      </button>
    </div>
  </hlm-sidebar-header>

  <hlm-sidebar-content>
    <ng-scrollbar hlm class="h-full">
      <hlm-sidebar-group>
        <div class="ctf-mode-switcher" *ngIf="!isCollapsed()">
          <button
            hlmBtn
            variant="ghost"
            class="h-8 text-xs gap-2"
            [class.bg-accent]="currentMode() === SidebarMode.Chats"
            (click)="setMode(SidebarMode.Chats)"
          >
            <ng-icon name="lucideMessageCircleDashed" />
            Chats
          </button>
          <button
            hlmBtn
            variant="ghost"
            class="h-8 text-xs gap-2"
            [class.bg-accent]="currentMode() === SidebarMode.WriteUps"
            (click)="setMode(SidebarMode.WriteUps)"
          >
            <ng-icon name="lucideFileText" />
            Writeups
          </button>
        </div>

        <div class="px-3 py-2">
          <button
            hlmSidebarMenuButton
            (click)="newAction()"
            class="text-sm text-left flex items-center gap-2 h-9 w-full"
            [ngClass]="{ 'justify-center': isCollapsed() }"
            [title]="currentMode() === SidebarMode.Chats ? 'New chat' : 'New writeup'"
          >
            <ng-icon name="lucidePlus" />
            <span *ngIf="!isCollapsed()" class="truncate">
              {{ currentMode() === SidebarMode.Chats ? 'New chat' : 'New writeup' }}
            </span>
          </button>
        </div>

        <div class="px-3 py-2 mb-2" *ngIf="!isCollapsed()">
          <div hlmInputGroup class="w-full">
            <div hlmInputGroupAddon>
              <ng-icon name="lucideSearch" />
            </div>

            <input
              hlmInputGroupInput
              class="w-full"
              placeholder="Search..."
              [aria-label]="currentMode() === SidebarMode.Chats ? 'Search chats' : 'Search writeups'"
              [(ngModel)]="search"
            />
          </div>
        </div>

        <!-- Chats List -->
        <ng-container *ngIf="currentMode() === SidebarMode.Chats">
          <div
            class="px-3 py-1 text-xs text-muted-foreground"
            *ngIf="!isCollapsed() && (sessionsLoading$ | async)"
          >
            Loading sessions...
          </div>

          <hlm-sidebar-separator />

          <div class="px-3 py-2">
            <div class="flex flex-col gap-2" *ngIf="sessions$ | async as sessions">
              <div
                *ngIf="(sessionsLoading$ | async) && sessions.length === 0 && !isCollapsed()"
                class="space-y-2"
              >
                <div class="h-8 rounded-md bg-muted/70 animate-pulse"></div>
                <div class="h-8 rounded-md bg-muted/70 animate-pulse"></div>
                <div class="h-8 rounded-md bg-muted/70 animate-pulse"></div>
              </div>

              <div
                *ngFor="let c of filteredChats(sessions)"
                class="group relative"
                [class.ctf-session-deleting]="isDeletingSession(c.id)"
              >
                <button
                  hlmSidebarMenuButton
                  (click)="openChat(c)"
                  class="text-sm text-left truncate flex items-center gap-2 h-9 pr-14 w-full"
                  [ngClass]="{
                    'justify-center': isCollapsed(),
                    'ctf-session-active': c.id === (activeSessionId$ | async),
                  }"
                  title="{{ c.name }}"
                >
                  <ng-icon name="lucideMessageCircleDashed" />
                  <span *ngIf="!isCollapsed()" class="truncate">
                    {{ c.name }}
                  </span>
                </button>

                <div
                  *ngIf="!isCollapsed()"
                  class="absolute right-2 top-1/2 -translate-y-1/2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity"
                >
                  <button
                    hlmBtn
                    size="sm"
                    variant="ghost"
                    (click)="$event.stopPropagation(); openRenameDialog(c)"
                    title="Rename session"
                  >
                    <ng-icon name="lucidePencil" />
                  </button>
                  <button
                    hlmBtn
                    size="sm"
                    variant="ghost"
                    class="text-destructive hover:text-destructive"
                    (click)="$event.stopPropagation(); openDeleteDialog(c)"
                    title="Delete session"
                  >
                    <ng-icon name="lucideTrash2" />
                  </button>
                </div>
              </div>
            </div>
          </div>
        </ng-container>

        <!-- WriteUps List -->
        <ng-container *ngIf="currentMode() === SidebarMode.WriteUps">
          <div
            class="px-3 py-1 text-xs text-muted-foreground"
            *ngIf="!isCollapsed() && (writeUpsLoading$ | async)"
          >
            Loading writeups...
          </div>

          <hlm-sidebar-separator />

          <div class="px-3 py-2">
            <div class="flex flex-col gap-2" *ngIf="writeUps$ | async as writeUps">
              <div
                *ngIf="(writeUpsLoading$ | async) && writeUps.length === 0 && !isCollapsed()"
                class="space-y-2"
              >
                <div class="h-8 rounded-md bg-muted/70 animate-pulse"></div>
                <div class="h-8 rounded-md bg-muted/70 animate-pulse"></div>
              </div>

              <div *ngIf="writeUps.length === 0 && !(writeUpsLoading$ | async)" class="text-xs text-muted-foreground px-1 py-4 text-center">
                No writeups for this session.
              </div>

              <div
                *ngFor="let w of filteredWriteUps(writeUps)"
                class="group relative"
              >
                <button
                  hlmSidebarMenuButton
                  (click)="openWriteUp(w)"
                  class="text-sm text-left truncate flex items-center gap-2 h-9 pr-14 w-full"
                  [ngClass]="{
                    'justify-center': isCollapsed(),
                    'ctf-session-active': w.id === (activeWriteUpId$ | async),
                  }"
                  title="{{ w.name }}"
                >
                  <ng-icon name="lucideFileText" />
                  <span *ngIf="!isCollapsed()" class="truncate">
                    {{ w.name }}
                  </span>
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </hlm-sidebar-group>
    </ng-scrollbar>
  </hlm-sidebar-content>

  <hlm-sidebar-footer *ngIf="!isCollapsed()">
    <div class="px-3 py-3 text-xs text-muted-foreground">
      Tip: Create projects to organize chats.
    </div>
  </hlm-sidebar-footer>
</hlm-sidebar>

<!-- Single Rename Dialog -->
<hlm-dialog>
  <button #renameTrigger brnDialogTrigger class="hidden"></button>
  <hlm-dialog-content
    *brnDialogContent="let ctx"
    [showCloseButton]="false"
    class="border border-border bg-background text-foreground shadow-lg rounded-md p-0 max-w-[425px] w-full overflow-hidden flex flex-col"
  >
    <hlm-dialog-header class="p-6 border-b border-border">
      <h3 hlmDialogTitle>Rename Session</h3>
    </hlm-dialog-header>
    <div class="p-6 space-y-4" *ngIf="sessionToRename">
      <div class="space-y-2">
        <label hlmLabel for="rename-input">Name</label>
        <input
          id="rename-input"
          hlmInput
          class="w-full"
          [(ngModel)]="renameDraftById[sessionToRename.id]"
          (keydown.enter)="renameSession(ctx)"
          placeholder="Session name"
        />
      </div>
    </div>
    <hlm-dialog-footer class="p-6 border-t border-border flex justify-between">
      <button hlmBtn variant="outline" (click)="ctx.close()">Cancel</button>
      <button hlmBtn (click)="renameSession(ctx)">Save</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>

<!-- Single Delete Dialog -->
<hlm-dialog>
  <button #deleteTrigger brnDialogTrigger class="hidden"></button>
  <hlm-dialog-content
    *brnDialogContent="let ctx"
    [showCloseButton]="false"
    class="border border-border bg-background text-foreground shadow-lg rounded-md p-0 max-w-[425px] w-full overflow-hidden flex flex-col"
  >
    <hlm-dialog-header class="p-6 border-b border-border">
      <h3 hlmDialogTitle>Delete Session</h3>
      <p hlmDialogDescription class="mt-2 text-sm text-muted-foreground" *ngIf="sessionToDelete">
        Delete "{{ sessionToDelete.name }}"? This action cannot be undone.
      </p>
    </hlm-dialog-header>
    <hlm-dialog-footer class="p-6 border-t border-border flex justify-between">
      <button hlmBtn variant="outline" (click)="ctx.close()">Cancel</button>
      <button hlmBtn variant="destructive" (click)="deleteSession(ctx)">Delete</button>
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
