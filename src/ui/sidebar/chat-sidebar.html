<hlm-sidebar class="ctf-chat-sidebar">
  <hlm-sidebar-header>
    <div class="flex w-full items-center justify-between px-4 py-3">
      <div *ngIf="!isCollapsed()" class="overflow-hidden whitespace-nowrap">
        <div class="font-semibold text-sm">Chat History</div>
        <div class="text-xs text-muted-foreground">Your recent conversations</div>
      </div>
      <button hlmSidebarMenuButton (click)="toggleSidebar()" class="ml-auto p-1 h-8 w-8 flex items-center justify-center shrink-0">
        <ng-icon name="lucidePanelLeft" />
      </button>
    </div>
  </hlm-sidebar-header>

  <hlm-sidebar-content>
    <ng-scrollbar hlm class="h-full">
      <hlm-sidebar-group>
        <div class="px-3 py-2">
          <button
            hlmSidebarMenuButton
            (click)="newChat()"
            class="text-sm text-left flex items-center gap-2 h-9"
            [ngClass]="{'justify-center': isCollapsed()}"
            title="New chat"
          >
            <ng-icon name="lucidePlus" />
            <span *ngIf="!isCollapsed()" class="truncate">New chat</span>
          </button>
        </div>

        <div class="px-3 py-2" *ngIf="!isCollapsed()">
          <div hlmInputGroup class="w-full">
            <div hlmInputGroupAddon>
              <ng-icon name="lucideSearch" />
            </div>

            <input
              hlmInputGroupInput
              class="w-full"
              placeholder="Search..."
              aria-label="Search chats"
              [(ngModel)]="search"
            />
          </div>
        </div>

        <hlm-sidebar-separator />

        <div class="px-3 py-2">
          <div *ngIf="!isCollapsed()" class="text-xs font-medium mb-2 flex items-center gap-2">
            <ng-icon name="lucideFolder" /> <span>Projects</span>
          </div>
          <div class="flex flex-col gap-1">
            <button hlmSidebarMenuButton *ngFor="let p of projects" 
                    class="text-sm text-left flex items-center gap-2 h-9"
                    [ngClass]="{'justify-center': isCollapsed()}"
                    title="{{ p.name }}">
              <ng-icon name="lucideFolder" />
              <span *ngIf="!isCollapsed()" class="truncate">{{ p.name }}</span>
            </button>
          </div>
        </div>

        <hlm-sidebar-separator />

        <div class="px-3 py-2">
          <div *ngIf="!isCollapsed()" class="text-xs font-medium mb-2 flex items-center gap-2">
            <ng-icon name="lucideMessageCircleDashed" /> <span>Chats</span>
          </div>
          <div class="flex flex-col gap-1">
            <button
              hlmSidebarMenuButton
              *ngFor="let c of filteredChats"
              (click)="openChat(c)"
              class="text-sm text-left truncate flex items-center gap-2 h-9"
              [ngClass]="{'justify-center': isCollapsed()}"
              title="{{ c.title }}"
            >
              <ng-icon name="lucideMessageCircleDashed" />
              <span *ngIf="!isCollapsed()" class="truncate">{{ c.title }}</span>
            </button>
          </div>
        </div>
      </hlm-sidebar-group>
    </ng-scrollbar>
  </hlm-sidebar-content>

  <hlm-sidebar-footer *ngIf="!isCollapsed()">
    <div class="px-3 py-3 text-xs text-muted-foreground">Tip: Create projects to organize chats.</div>
  </hlm-sidebar-footer>
</hlm-sidebar>
