<div class="backdrop" *ngIf="(modal.current$ | async) as req">
  <div class="dialog" (click)="$event.stopPropagation()">
    <div class="title">Sudo</div>
    <div class="prompt">{{ req.prompt }}</div>

    <input
      class="input"
      type="password"
      autocomplete="current-password"
      (keyup.enter)="submit()"
      (input)="password.set(($any($event.target).value))"
      placeholder="Mot de passe"
      autofocus
    />

    <div class="actions">
      <button class="btn secondary" (click)="cancel()">Annuler</button>
      <button class="btn primary" (click)="submit()">Valider</button>
    </div>
  </div>
</div>
