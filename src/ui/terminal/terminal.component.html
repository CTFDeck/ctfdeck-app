<div
  class="terminal-container flex flex-col h-full w-full bg-card text-card-foreground overflow-hidden rounded-md font-mono"
  (click)="focusInput()"
>
  <div
    class="terminal-header flex items-center px-3 py-2 bg-muted/30 border-b border-border"
    (click)="$event.stopPropagation()"
  >
    <div class="relative inline-block">
      <button
        hlmBtn
        variant="ghost"
        class="h-6 p-1 gap-2 text-xs font-normal hover:bg-zinc-800"
        (click)="toggleServerSelection($event)"
      >
        <div
          class="status-indicator"
          [class.bg-green-500]="isConnected"
          [class.bg-red-500]="!isConnected"
        ></div>
        <span class="status-text text-xs text-muted-foreground">{{
          isConnected ? 'Connected to ' + serverUrl : 'Disconnected'
        }}</span>
      </button>

      <div
        *ngIf="showServerSelection"
        class="absolute top-full left-0 mt-2 w-80 z-50 p-4 rounded-md border border-border bg-popover text-popover-foreground shadow-md outline-none animate-in fade-in-0 zoom-in-95 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[side=bottom]:slide-in-from-top-2"
      >
        <div class="space-y-2 mb-4">
          <h4 class="font-medium leading-none">Connection Settings</h4>
          <p class="text-sm text-muted-foreground">Configure the WebSocket server URL.</p>
        </div>

        <div class="grid gap-2 mb-4">
          <div class="grid grid-cols-3 items-center gap-4">
            <label
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
              for="url"
              >Server URL</label
            >
            <input
              id="url"
              [(ngModel)]="serverUrl"
              class="col-span-2 h-8 text-xs flex w-full rounded-md border border-input bg-background px-3 py-1 shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
            />
          </div>
          <div class="flex justify-end gap-2">
            <button hlmBtn size="sm" variant="outline" (click)="saveServer()">Save</button>
            <button hlmBtn size="sm" (click)="reconnect(); showServerSelection = false">
              Connect
            </button>
          </div>
        </div>

        <div class="grid gap-2" *ngIf="savedServers.length > 0">
          <h4 class="font-medium text-xs text-muted-foreground mt-2">Saved Servers</h4>
          <div class="flex flex-col gap-1">
            <div
              *ngFor="let server of savedServers"
              class="flex items-center justify-between p-2 rounded hover:bg-accent hover:text-accent-foreground cursor-pointer group"
              (click)="selectServer(server); showServerSelection = false"
            >
              <span class="text-xs truncate flex-1">{{ server }}</span>
              <button
                hlmBtn
                size="icon"
                variant="ghost"
                class="h-6 w-6 opacity-0 group-hover:opacity-100"
                (click)="removeServer(server, $event)"
              >
                <ng-icon name="lucideTrash2" size="sm" class="text-destructive" />
              </button>
            </div>
          </div>
        </div>
      </div>

      <div
        *ngIf="showServerSelection"
        class="fixed inset-0 z-40 bg-transparent"
        (click)="showServerSelection = false"
      ></div>
    </div>
  </div>

  <div class="terminal-output flex-1 p-3 overflow-auto text-sm leading-relaxed" #scrollContainer>
    <div
      *ngFor="let line of lines"
      class="line mb-0.5 break-all"
      [ngClass]="{
        'font-bold text-foreground mt-2': line.type === 'command',
        'text-muted-foreground': line.type === 'output',
        'text-destructive': line.type === 'error',
        'text-primary italic': line.type === 'info',
        'line-animated': line.type === 'output' || line.type === 'ls',
      }"
    >
      <!-- LS grid display -->
      <ng-container *ngIf="line.type === 'ls' && line.lsEntries?.length; else normalLine">
        <div class="ls-grid">
          <span
            *ngFor="let e of line.lsEntries"
            class="ls-item"
            [ngClass]="classForPrefix(e.prefix)"
          >
            {{ e.name }}
          </span>
        </div>
      </ng-container>

      <ng-template #normalLine>
        <!-- For output type, use innerHTML to render ANSI-converted HTML -->
        <span
          *ngIf="line.type === 'output'"
          class="content whitespace-pre-wrap"
          [innerHTML]="line.content"
        ></span>
        <span *ngIf="line.type !== 'output'" class="content whitespace-pre-wrap">{{
          line.content
        }}</span>
      </ng-template>
    </div>

    <!-- Autocomplete suggestions shown inline near input -->
    <div *ngIf="autocompleteSuggestions.length > 0" class="autocomplete-suggestions mb-2">
      <div class="autocomplete-grid">
        <span
          *ngFor="let e of autocompleteSuggestions"
          class="autocomplete-item"
          [ngClass]="classForPrefix(e.prefix)"
          >{{ e.name }}</span
        >
      </div>
    </div>

    <div class="input-line flex items-center mt-2">
      <span class="prompt text-primary font-bold mr-2">{{ prompt }}</span>
      <input
        #commandInput
        class="flex-1 bg-transparent border-none outline-none text-foreground font-inherit text-inherit p-0 m-0"
        type="text"
        [(ngModel)]="currentCommand"
        (keydown.enter)="executeCommand()"
        (keydown.arrowup)="navigateHistory('up', $event)"
        (keydown.arrowdown)="navigateHistory('down', $event)"
        (keydown.tab)="onTabAutocomplete($event)"
        (input)="onInput()"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
  </div>
</div>
