<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CTFDeckApp</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Prevent flash of un-themed content: read saved preference or system preference and set class on <html> -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (
            theme === 'dark' ||
            (!theme &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
