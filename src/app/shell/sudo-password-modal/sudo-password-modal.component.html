<div class="backdrop" *ngIf="modal.current$ | async as req" (click)="cancel()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <div class="title">Sudo</div>
    <div class="prompt">{{ req.prompt }}</div>

    <div class="field">
      <label hlmLabel for="sudo-password">Password</label>
      <input
        id="sudo-password"
        hlmInput
        type="password"
        autocomplete="current-password"
        (keyup.enter)="submit()"
        (keyup.escape)="cancel()"
        (input)="password.set($any($event.target).value)"
       
      />
    </div>

    <div class="actions">
      <button hlmBtn variant="outline" type="button" (click)="cancel()">Annuler</button>
      <button hlmBtn type="button" (click)="submit()">Valider</button>
    </div>
  </div>
</div>
