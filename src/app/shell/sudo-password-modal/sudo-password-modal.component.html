@if (modal.current$ | async; as req) {
  <div
    class="backdrop"
    tabindex="0"
    role="button"
    aria-label="Close sudo password dialog"
    (click)="$event.target === $event.currentTarget && cancel()"
    (keydown.enter)="cancel()"
    (keydown.space)="cancel(); $event.preventDefault()"
  >
    <div class="dialog">
      <div class="title">Sudo</div>
      <div class="prompt">{{ req.prompt }}</div>

      <div class="field">
        <label hlmLabel for="sudo-password">Password</label>
        <input
          id="sudo-password"
          hlmInput
          type="password"
          autocomplete="current-password"
          (keyup.enter)="submit()"
          (keyup.escape)="cancel()"
          (input)="password.set($any($event.target).value)"
        />
      </div>

      <div class="actions">
        <button hlmBtn variant="outline" type="button" (click)="cancel()">Annuler</button>
        <button hlmBtn type="button" (click)="submit()">Valider</button>
      </div>
    </div>
  </div>
}
