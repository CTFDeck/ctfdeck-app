@if (modal.current$ | async; as req) {
  <div
    class="backdrop"
    tabindex="0"
    role="button"
    [attr.aria-label]="'sudo.ariaClose' | translate"
    (click)="$event.target === $event.currentTarget && cancel()"
    (keydown.enter)="cancel()"
    (keydown.space)="cancel(); $event.preventDefault()"
  >
    <div class="dialog" (keydown)="$event.stopPropagation()" (keyup)="$event.stopPropagation()">
      <div class="title">{{ 'sudo.title' | translate }}</div>
      <div class="prompt">{{ req.prompt }}</div>

      <div class="field">
        <label hlmLabel for="sudo-password">{{ 'sudo.passwordLabel' | translate }}</label>
        <input
          #passwordInput
          id="sudo-password"
          hlmInput
          type="password"
          autocomplete="current-password"
          (keydown.enter)="submit()"
          (keydown.escape)="cancel()"
          (input)="password.set($any($event.target).value)"
        />
      </div>

      <div class="actions">
        <button hlmBtn variant="outline" type="button" (click)="cancel()">
          {{ 'sudo.cancel' | translate }}
        </button>
        <button hlmBtn type="button" (click)="submit()">
          {{ 'sudo.submit' | translate }}
        </button>
      </div>
    </div>
  </div>
}
