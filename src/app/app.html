<div class="app-root flex flex-col h-screen">
  <spartan-menubar
    (openTargetManagerEvent)="openTargetManager($event)"
    (openCommandRunnerEvent)="openCommandRunner($event)"
  ></spartan-menubar>

  <div class="app-layout flex-1 flex overflow-hidden">
    <ctf-chat-sidebar
      class="flex-none border-r border-border transition-[width] duration-300 ease-in-out"
    ></ctf-chat-sidebar>

    <main class="app-main flex-1 overflow-auto relative">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div
    *ngIf="targetManagerVisible"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
    (click)="closeTargetManager()"
  >
    <div
      class="bg-slate-900 border border-border rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <app-target-manager
        [mode]="targetManagerMode"
        (closeEvent)="closeTargetManager()"
      ></app-target-manager>
    </div>
  </div>

  <div
    *ngIf="commandRunnerVisible"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
    (click)="closeCommandRunner()"
  >
    <div
      class="bg-background border border-border rounded-xl shadow-2xl max-w-6xl w-full max-h-[90vh] overflow-hidden flex flex-col"
      (click)="$event.stopPropagation()"
    >
      <app-command-runner
        [initialToolId]="selectedToolId"
        (closeEvent)="closeCommandRunner()"
      ></app-command-runner>
    </div>
  </div>

  <ctfdeck-sudo-password-modal></ctfdeck-sudo-password-modal>

  <hlm-toaster />
</div>
