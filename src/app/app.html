<div class="app-root flex flex-col h-screen">
  <spartan-menubar
    (openTargetManagerEvent)="openTargetManager($event)"
    (openCommandRunnerEvent)="openCommandRunner($event)"
    (openMissingToolsEvent)="toolModal.forceOpen()"
  ></spartan-menubar>

  <div class="app-layout flex-1 flex overflow-hidden">
    <ctf-workspace-sidebar
      class="flex-none border-r border-border transition-[width] duration-300 ease-in-out"
    ></ctf-workspace-sidebar>

    <main class="app-main flex-1 overflow-auto relative">
      <router-outlet></router-outlet>
    </main>
  </div>

  @if (targetManagerVisible) {
    <div
      class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto"
      [attr.aria-label]="'app.ariaCloseTargetManager' | translate"
      (click)="$event.target === $event.currentTarget && closeTargetManager()"
    >
      <div class="bg-slate-900 border border-border rounded-t-2xl sm:rounded-xl shadow-2xl w-full sm:max-w-2xl h-[95dvh] sm:h-[90vh] max-h-[95dvh] sm:max-h-[90vh] overflow-hidden flex flex-col">
        <app-target-manager
          #targetManager
          class="flex-1 min-h-0"
          [mode]="targetManagerMode"
          (closeEvent)="closeTargetManager()"
        ></app-target-manager>
      </div>
    </div>
  }

  @if (commandRunnerVisible) {
    <div
      class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-start justify-center sm:pt-16 p-0 sm:p-4 overflow-y-auto"
      [attr.aria-label]="'app.ariaCloseCommandRunner' | translate"
      (click)="$event.target === $event.currentTarget && closeCommandRunner()"
    >
      <div class="bg-background border border-border rounded-t-2xl sm:rounded-xl shadow-2xl w-full sm:max-w-5xl h-[90dvh] sm:h-[84vh] max-h-[90dvh] sm:max-h-[84vh] overflow-hidden flex flex-col">
        <app-command-runner
          [initialToolId]="selectedToolId"
          (closeEvent)="closeCommandRunner()"
        ></app-command-runner>
      </div>
    </div>
  }

  <ctfdeck-sudo-password-modal></ctfdeck-sudo-password-modal>
  <app-tool-install-modal #toolModal></app-tool-install-modal>

  <hlm-toaster />
</div>
